name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same pinned toolchain as CI (see ci.yml).
      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
        with:
          sdk-components: |
            platforms;android-37
            build-tools;36.0.0
            cmake;3.22.1
            ndk;28.2.13676358

      - name: Cache Gradle (wrapper + dependencies)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'app/build.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK + AAB (unsigned)
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      # The download source for builds: open this run → Artifacts tab.
      # Kept for a year (the default retention is only 90 days).
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bloom-release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 365
